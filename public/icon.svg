<!-- Red Badge Gradient -->
<linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#e63946" />
  <stop offset="100%" stop-color="#9b2226" />
</linearGradient>

<!-- Gold Gradient -->
<linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#ffd166" />
  <stop offset="100%" stop-color="#f4a261" />
</linearGradient>

<!-- Text Gradient -->
<linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#d90429" />
  <stop offset="100%" stop-color="#6a040f" />
</linearGradient>

<!-- Drop Shadow Filter -->
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
  <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15" />
</filter>


<!-- Numbers Displayed on the Book -->
<text x="0" y="-5" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">42 78 99</text>
<text x="0" y="15" font-family="Arial, sans-serif" font-weight="bold" font-size="14" fill="#ffffff" text-anchor="middle">12 88 36</text>


